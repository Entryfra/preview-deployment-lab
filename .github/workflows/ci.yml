name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Войти в Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать frontend-образ
        run: |
          docker build \
            -t ghcr.io/entryfra/preview-deployment-frontend:latest \
            ./frontend

      - name: Загрузить образ в Registry
        run: |
          docker push ghcr.io/entryfra/preview-deployment-frontend:latest

      - name: Подготовить SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Обновить приложение на VPS
        run: |
          ssh \
            -i ~/.ssh/github_actions \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'cd /home/ilya/preview-deployment-lab &&
             git pull &&
             docker compose -f docker-compose.prod.yml pull &&
             docker compose -f docker-compose.prod.yml up -d'
