name: Preview Deployment

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

# Запускаем workflow при событиях Pull Request
on:
  pull_request:
    types:
      - opened       # PR создали
      - synchronize  # в ветку PR добавили новый commit
      - reopened     # PR снова открыли
      - closed       # PR закрыли или объединили с main

jobs:
  # Создаём или обновляем preview
  deploy-preview:
    # При закрытом PR этот job не запускается
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      # Загружаем на GitHub Runner код именно из ветки PR
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Авторизуем GitHub Runner в GHCR
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Собираем frontend и публикуем готовый образ в GHCR
      # Например, для PR №2 тег образа будет pr-2
      - name: Build and push preview image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/entryfra/preview-deployment-frontend:pr-${{ github.event.pull_request.number }}

      # Подключаемся к VPS и запускаем готовый образ
      - name: Deploy preview on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            cd /home/preview-deployment-lab

            # Загружаем свежие данные Git
            git fetch origin

            # Переключаем папку на код конкретного PR
            git checkout ${{ github.event.pull_request.head.sha }}

            # Скачиваем готовый образ PR из GHCR
            PR_NUMBER=${{ github.event.pull_request.number }} docker compose \
              -f docker-compose.preview.yml \
              -p preview-${{ github.event.pull_request.number }} \
              pull

            # Запускаем или обновляем preview-контейнер
            PR_NUMBER=${{ github.event.pull_request.number }} docker compose \
              -f docker-compose.preview.yml \
              -p preview-${{ github.event.pull_request.number }} \
              up -d --force-recreate

      # Оставляем сообщение в Pull Request
      - name: Comment preview link
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Preview готов

              Адрес: http://pr-${{ github.event.pull_request.number }}.localhost`
            })

  # Удаляем preview после закрытия или merge PR
  delete-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Delete preview from server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            cd /home/preview-deployment-lab

            # Удаляем контейнеры конкретного PR
            PR_NUMBER=${{ github.event.pull_request.number }} docker compose \
              -f docker-compose.preview.yml \
              -p preview-${{ github.event.pull_request.number }} \
              down --remove-orphans
