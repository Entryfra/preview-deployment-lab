services:
  frontend-preview:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend-pr-15.rule=Host(`pr-${PR_NUMBER}.localhost`)
      - traefik.http.routers.frontend-pr-15.entrypoints=web
      - traefik.http.services.frontend-pr-15.loadbalancer.server.port=80

    networks:
      - traefik-network

networks:
  traefik-network:
    external: true
    name: preview-deployment-lab_default    
